<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for Celebration Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        .bubble-btn {
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        }
        .bubble-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
        }
        .bubble-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .venn-circle {
            mix-blend-mode: multiply;
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-6">

    <!-- Header Section -->
    <header class="max-w-4xl mx-auto w-full bg-white rounded-3xl p-4 sm:p-6 card-shadow border-4 border-sky-300 mb-6 relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 opacity-10 text-sky-600 pointer-events-none">
            <i class="fa-solid fa-calculator text-9xl"></i>
        </div>
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 relative z-10">
            <div class="flex items-center space-x-3 text-center sm:text-left">
                <div class="w-14 h-14 bg-amber-400 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-md flex-shrink-0">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <span class="inline-block px-3 py-1 bg-sky-100 text-sky-700 rounded-full text-xs font-bold tracking-wide mb-1">
                        聖公會李兆強小學 數學科
                    </span>
                    <h1 class="text-xl sm:text-2xl font-black text-slate-800 leading-tight">
                        四年級 4上B 第15課 <span class="text-sky-600">公因數和最大公因數</span>
                    </h1>
                </div>
            </div>
            <!-- Audio Toggle Button -->
            <button id="soundToggle" onclick="toggleSound()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-sm flex items-center space-x-2 transition">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                <span id="soundText">音效：開啟</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full flex-grow flex flex-col">
        
        <!-- Score Board Bar -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white p-3 sm:p-4 rounded-2xl border-2 border-emerald-200 card-shadow text-center">
                <p class="text-xs sm:text-sm font-bold text-slate-400 mb-1">目前得分</p>
                <p id="scoreDisplay" class="text-2xl sm:text-3xl font-black text-emerald-500 font-fredoka">0</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-2xl border-2 border-sky-200 card-shadow text-center">
                <p class="text-xs sm:text-sm font-bold text-slate-400 mb-1">答題進度</p>
                <p class="text-2xl sm:text-3xl font-black text-sky-500 font-fredoka">
                    <span id="currentQIndex">1</span>/<span id="totalQCount">10</span>
                </p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-2xl border-2 border-amber-200 card-shadow text-center">
                <p class="text-xs sm:text-sm font-bold text-slate-400 mb-1">一次答對率</p>
                <p id="accuracyDisplay" class="text-2xl sm:text-3xl font-black text-amber-500 font-fredoka">100%</p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 rounded-full h-3 mb-6 overflow-hidden p-0.5 card-shadow">
            <div id="progressBar" class="bg-gradient-to-r from-sky-400 to-emerald-400 h-2 rounded-full transition-all duration-500" style="width: 10%"></div>
        </div>

        <!-- Question Card Container -->
        <div id="quizBox" class="bg-white rounded-3xl p-6 sm:p-8 card-shadow border-4 border-slate-100 flex-grow flex flex-col justify-between relative">
            
            <!-- Question Content Header -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <span id="typeBadge" class="px-3 py-1 bg-amber-100 text-amber-800 text-xs sm:text-sm font-bold rounded-lg">
                        題型：概念探索
                    </span>
                    <span id="attemptBadge" class="text-xs sm:text-sm font-bold text-sky-600 bg-sky-50 px-3 py-1 rounded-full border border-sky-200">
                        首次嘗試 (可得 100 分)
                    </span>
                </div>

                <h2 id="questionText" class="text-lg sm:text-xl font-bold text-slate-800 mb-6 leading-relaxed">
                    載入題目中...
                </h2>

                <!-- Interactive Area -->
                <div id="interactiveArea" class="mb-6">
                    <!-- Dynamic Content Inserted Here -->
                </div>
            </div>

            <!-- Hint Box (Initially Hidden) -->
            <div id="hintBox" class="hidden mb-6 p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl text-amber-900 text-sm sm:text-base animate-pulse-subtle">
                <div class="flex items-start space-x-3">
                    <i class="fa-solid fa-lightbulb text-amber-500 text-xl mt-0.5"></i>
                    <div>
                        <p class="font-bold text-amber-800 mb-1">小導師提示（還有1次補答機會！）：</p>
                        <p id="hintText" class="leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <!-- Answer Result Banner (Initially Hidden) -->
            <div id="feedbackBox" class="hidden mb-6 p-4 rounded-2xl text-center font-bold text-lg">
                <!-- Result feedback content -->
            </div>

            <!-- Footer / Action Buttons -->
            <div class="flex justify-end pt-4 border-t border-slate-100">
                <button id="submitBtn" onclick="checkAnswer()" class="bubble-btn px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl w-full sm:w-auto">
                    確認答案 <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Final Report Modal (Initially Hidden) -->
        <div id="reportBox" class="hidden bg-white rounded-3xl p-6 sm:p-8 card-shadow border-4 border-amber-300 text-center">
            <div class="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 border-4 border-amber-300 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">學習成果報告</h2>
            <p class="text-slate-500 mb-6 font-bold">恭喜完成 4上B 第15課「公因數和最大公因數」練習！</p>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <p class="text-xs text-slate-400 font-bold mb-1">最終總分</p>
                    <p id="finalScore" class="text-3xl font-black text-emerald-500 font-fredoka">0</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <p class="text-xs text-slate-400 font-bold mb-1">總題數</p>
                    <p id="finalTotalQ" class="text-3xl font-black text-slate-700 font-fredoka">10</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <p class="text-xs text-slate-400 font-bold mb-1">一次即對</p>
                    <p id="finalFirstTry" class="text-3xl font-black text-sky-500 font-fredoka">0</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <p class="text-xs text-slate-400 font-bold mb-1">首答正確率</p>
                    <p id="finalAccuracy" class="text-3xl font-black text-amber-500 font-fredoka">0%</p>
                </div>
            </div>

            <div id="badgeContainer" class="p-4 bg-amber-50 rounded-2xl border-2 border-amber-200 mb-6">
                <span id="badgeTitle" class="text-xl font-black text-amber-800 block mb-1">🏅 稱號：因數小達人</span>
                <p id="badgeDesc" class="text-sm text-amber-700">表現太棒了！你已經完全掌握公因數的尋找技巧！</p>
            </div>

            <button onclick="restartQuiz()" class="bubble-btn px-8 py-4 bg-sky-500 hover:bg-sky-600 text-white font-black text-xl rounded-2xl w-full sm:w-auto">
                <i class="fa-solid fa-rotate-right mr-2"></i> 再玩一次
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-slate-400 text-xs font-bold mt-6">
        聖公會李兆強小學 SKH Lee Siu Keung Primary School • 數學科互動學習平台
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // Web Audio Sound Synthesizer (No external asset dependency)
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(220, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            document.getElementById('soundText').innerText = soundEnabled ? "音效：開啟" : "音效：關閉";
        }

        // Question Database
        const questionBank = [
            {
                type: 'venn',
                badge: '公因數與最大公因數',
                num1: 12,
                num2: 18,
                factors1: [1, 2, 3, 4, 6, 12],
                factors2: [1, 2, 3, 6, 9, 18],
                commonFactors: [1, 2, 3, 6],
                gcf: 6,
                question: '請找出 12 和 18 的「公因數」以及「最大公因數 (H.C.F.)」：',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'choice',
                badge: '選擇題',
                num1: 8,
                num2: 12,
                options: ['1, 2', '1, 2, 4', '1, 2, 4, 8', '2, 4'],
                correctAnswer: '1, 2, 4',
                gcf: 4,
                question: '下列哪一組數是 8 和 12 的所有「公因數」？',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'gcf_direct',
                badge: '最大公因數計算',
                num1: 15,
                num2: 25,
                commonFactors: [1, 5],
                gcf: 5,
                question: '請填寫 15 和 25 的公因數與最大公因數：',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'choice',
                badge: '選擇題',
                num1: 14,
                num2: 21,
                options: ['3', '7', '14', '21'],
                correctAnswer: '7',
                gcf: 7,
                question: '14 和 21 的「最大公因數 (H.C.F.)」是多少？',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'venn',
                badge: '公因數與最大公因數',
                num1: 16,
                num2: 24,
                factors1: [1, 2, 4, 8, 16],
                factors2: [1, 2, 3, 4, 6, 8, 12, 24],
                commonFactors: [1, 2, 4, 8],
                gcf: 8,
                question: '請找出 16 和 24 的公因數與最大公因數：',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'gcf_direct',
                badge: '最大公因數計算',
                num1: 9,
                num2: 27,
                commonFactors: [1, 3, 9],
                gcf: 9,
                question: '9 和 27 的「最大公因數」是多少？',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'choice',
                badge: '概念應用題',
                num1: 20,
                num2: 30,
                options: ['1, 2, 5, 10', '1, 2, 4, 5, 10', '2, 5, 10', '1, 5, 10'],
                correctAnswer: '1, 2, 5, 10',
                gcf: 10,
                question: '20 和 30 的所有「公因數」是：',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'gcf_direct',
                badge: '最大公因數計算',
                num1: 18,
                num2: 24,
                commonFactors: [1, 2, 3, 6],
                gcf: 6,
                question: '請算出 18 和 24 的最大公因數 (H.C.F.)：',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'choice',
                badge: '特殊數字思考',
                num1: 7,
                num2: 11,
                options: ['0', '1', '7', '11'],
                correctAnswer: '1',
                gcf: 1,
                question: '7 和 11 的「最大公因數」是多少？',
                hint: '再試一次囉！請仔細檢查計算。'
            },
            {
                type: 'gcf_direct',
                badge: '綜合應用',
                num1: 12,
                num2: 36,
                commonFactors: [1, 2, 3, 4, 6, 12],
                gcf: 12,
                question: '請找出 12 和 36 的最大公因數：',
                hint: '再試一次囉！請仔細檢查計算。'
            }
        ];

        // State Variables
        let currentQ = 0;
        let score = 0;
        let attemptsLeft = 2; // 2 attempts per question
        let firstTryCorrectCount = 0;
        let userSelectedOption = null;

        // Initialize App
        window.onload = () => {
            loadQuestion();
        };

        function loadQuestion() {
            attemptsLeft = 2;
            userSelectedOption = null;

            const q = questionBank[currentQ];
            
            // UI Updates
            document.getElementById('currentQIndex').innerText = currentQ + 1;
            document.getElementById('totalQCount').innerText = questionBank.length;
            document.getElementById('typeBadge').innerText = '題型：' + q.badge;
            document.getElementById('questionText').innerText = (currentQ + 1) + '. ' + q.question;
            
            document.getElementById('progressBar').style.width = ((currentQ + 1) / questionBank.length * 100) + '%';
            
            updateAttemptBadge();

            // Hide boxes
            document.getElementById('hintBox').classList.add('hidden');
            document.getElementById('feedbackBox').classList.add('hidden');
            
            const interactiveArea = document.getElementById('interactiveArea');
            interactiveArea.innerHTML = '';

            // Render specific template based on type
            if (q.type === 'venn') {
                renderVennQuestion(q, interactiveArea);
            } else if (q.type === 'choice') {
                renderChoiceQuestion(q, interactiveArea);
            } else if (q.type === 'gcf_direct') {
                renderDirectQuestion(q, interactiveArea);
            }

            // Enable submit button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '確認答案 <i class="fa-solid fa-arrow-right ml-2"></i>';
            submitBtn.className = "bubble-btn px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl w-full sm:w-auto";
        }

        function updateAttemptBadge() {
            const badge = document.getElementById('attemptBadge');
            if (attemptsLeft === 2) {
                badge.innerText = '首次嘗試 (答對得 100 分)';
                badge.className = 'text-xs sm:text-sm font-bold text-sky-600 bg-sky-50 px-3 py-1 rounded-full border border-sky-200';
            } else {
                badge.innerText = '補答機會 (答對得 50 分)';
                badge.className = 'text-xs sm:text-sm font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200';
            }
        }

        // --- Render Templates ---

        // Type 1: Interactive Venn Diagram / Factors Checklist
        function renderVennQuestion(q, container) {
            let html = `
                <div class="bg-slate-50 p-4 sm:p-6 rounded-2xl border-2 border-slate-200 mb-4">
                    <div class="space-y-4">
                        <div>
                            <label class="block font-bold text-slate-700 mb-2">
                                1. 請選出 ${q.num1} 和 ${q.num2} 的所有「公因數」（可多選）：
                            </label>
                            <div class="flex flex-wrap gap-2" id="commonFactorsChecklist">
            `;

            // Unique factors combined
            const allFactors = Array.from(new Set([...q.factors1, ...q.factors2])).sort((a,b)=>a-b);
            allFactors.forEach(f => {
                html += `
                    <button type="button" onclick="toggleFactorSelect(this, ${f})" class="factor-chip px-4 py-2 bg-white border-2 border-slate-300 hover:border-sky-400 rounded-xl font-bold text-slate-700 transition">
                        ${f}
                    </button>
                `;
            });

            html += `
                            </div>
                        </div>

                        <div class="pt-2">
                            <label class="block font-bold text-slate-700 mb-2">
                                2. 請輸入 ${q.num1} 和 ${q.num2} 的「最大公因數 (H.C.F.)」：
                            </label>
                            <input type="number" id="gcfInput" placeholder="請輸入數字" class="w-full sm:w-48 p-3 border-2 border-slate-300 rounded-xl font-bold text-lg focus:border-sky-500 focus:outline-none">
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        let selectedFactors = [];
        function toggleFactorSelect(btn, value) {
            playSound('click');
            if (selectedFactors.includes(value)) {
                selectedFactors = selectedFactors.filter(v => v !== value);
                btn.classList.remove('bg-sky-500', 'text-white', 'border-sky-500');
                btn.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
            } else {
                selectedFactors.push(value);
                btn.classList.add('bg-sky-500', 'text-white', 'border-sky-500');
                btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
            }
        }

        // Type 2: Multiple Choice
        function renderChoiceQuestion(q, container) {
            let html = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            `;
            q.options.forEach((opt, idx) => {
                html += `
                    <button type="button" onclick="selectOption(this, '${opt}')" class="option-btn p-4 bg-slate-50 border-2 border-slate-200 hover:border-sky-400 hover:bg-sky-50 rounded-2xl font-bold text-left text-slate-700 text-lg transition flex items-center justify-between">
                        <span><span class="inline-block w-8 h-8 rounded-xl bg-white text-sky-600 border border-slate-200 text-center leading-8 font-black mr-2">${String.fromCharCode(65+idx)}</span> ${opt}</span>
                        <i class="fa-regular fa-circle text-slate-300 check-icon"></i>
                    </button>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function selectOption(btn, value) {
            playSound('click');
            userSelectedOption = value;
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('border-sky-500', 'bg-sky-50');
                b.querySelector('.check-icon').className = 'fa-regular fa-circle text-slate-300 check-icon';
            });
            btn.classList.add('border-sky-500', 'bg-sky-50');
            btn.querySelector('.check-icon').className = 'fa-solid fa-circle-check text-sky-500 check-icon';
        }

        // Type 3: Direct Input Question
        function renderDirectQuestion(q, container) {
            let html = `
                <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center space-y-4">
                    <div class="flex items-center justify-center space-x-4 text-2xl font-black text-sky-700">
                        <span class="px-4 py-2 bg-white rounded-xl shadow-sm border border-slate-200">${q.num1}</span>
                        <span>與</span>
                        <span class="px-4 py-2 bg-white rounded-xl shadow-sm border border-slate-200">${q.num2}</span>
                    </div>
                    <div class="max-w-xs mx-auto">
                        <label class="block font-bold text-slate-700 mb-2">最大公因數 (H.C.F.) 是：</label>
                        <input type="number" id="directGcfInput" placeholder="請輸入答案" class="w-full text-center p-3 border-2 border-slate-300 rounded-xl font-bold text-2xl focus:border-sky-500 focus:outline-none">
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // --- Answer Checking Logic ---

        function checkAnswer() {
            const q = questionBank[currentQ];
            let isCorrect = false;

            if (q.type === 'venn') {
                const gcfVal = parseInt(document.getElementById('gcfInput').value);
                const isCommonCorrect = JSON.stringify(selectedFactors.sort((a,b)=>a-b)) === JSON.stringify(q.commonFactors.sort((a,b)=>a-b));
                const isGcfCorrect = gcfVal === q.gcf;
                isCorrect = isCommonCorrect && isGcfCorrect;
            } else if (q.type === 'choice') {
                if (!userSelectedOption) {
                    showCustomToast('請先選擇一個答案！');
                    return;
                }
                isCorrect = userSelectedOption === q.correctAnswer;
            } else if (q.type === 'gcf_direct') {
                const inputVal = parseInt(document.getElementById('directGcfInput').value);
                if (isNaN(inputVal)) {
                    showCustomToast('請輸入數字答案！');
                    return;
                }
                isCorrect = inputVal === q.gcf;
            }

            // Process Answer Status
            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        function handleCorrectAnswer() {
            playSound('correct');
            triggerConfetti();

            const pointsGained = attemptsLeft === 2 ? 100 : 50;
            score += pointsGained;
            if (attemptsLeft === 2) {
                firstTryCorrectCount++;
            }

            updateScoreBoard();

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = "mb-6 p-4 rounded-2xl text-center font-bold text-lg bg-emerald-100 text-emerald-800 border-2 border-emerald-300 block";
            feedbackBox.innerHTML = `<i class="fa-solid fa-circle-check text-2xl mr-2"></i> 答對了！太厲害了！ (+${pointsGained}分)`;

            document.getElementById('hintBox').classList.add('hidden');
            
            autoProceedToNext();
        }

        function handleWrongAnswer() {
            playSound('wrong');
            attemptsLeft--;

            if (attemptsLeft === 1) {
                // First wrong attempt -> Show Hint and Allow Retry
                updateAttemptBadge();
                const hintBox = document.getElementById('hintBox');
                document.getElementById('hintText').innerText = questionBank[currentQ].hint;
                hintBox.classList.remove('hidden');

                const feedbackBox = document.getElementById('feedbackBox');
                feedbackBox.className = "mb-6 p-4 rounded-2xl text-center font-bold text-lg bg-amber-100 text-amber-800 border-2 border-amber-300 block";
                feedbackBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-2xl mr-2"></i> 答案不太對哦！請看下方提示後進行補答！`;

            } else {
                // Second wrong attempt -> Auto proceed
                const feedbackBox = document.getElementById('feedbackBox');
                feedbackBox.className = "mb-6 p-4 rounded-2xl text-center font-bold text-lg bg-rose-100 text-rose-800 border-2 border-rose-300 block";
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl mr-2"></i> 補答仍未正確，正確解答是：${getCorrectAnswerText()}`;

                document.getElementById('hintBox').classList.add('hidden');
                autoProceedToNext();
            }
        }

        function getCorrectAnswerText() {
            const q = questionBank[currentQ];
            if (q.type === 'venn') {
                return `公因數為 [${q.commonFactors.join(', ')}]，最大公因數 (H.C.F.) 為 ${q.gcf}`;
            } else if (q.type === 'choice') {
                return q.correctAnswer;
            } else if (q.type === 'gcf_direct') {
                return q.gcf;
            }
        }

        function autoProceedToNext() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.className = "px-8 py-3 bg-slate-300 text-slate-500 font-black text-lg rounded-2xl w-full sm:w-auto cursor-not-allowed";
            submitBtn.innerText = "自動跳轉中...";

            selectedFactors = [];

            setTimeout(() => {
                currentQ++;
                if (currentQ < questionBank.length) {
                    loadQuestion();
                } else {
                    showFinalReport();
                }
            }, 2200);
        }

        function updateScoreBoard() {
            document.getElementById('scoreDisplay').innerText = score;
            const accuracy = Math.round((firstTryCorrectCount / (currentQ + 1)) * 100);
            document.getElementById('accuracyDisplay').innerText = (isNaN(accuracy) ? 100 : accuracy) + '%';
        }

        function showFinalReport() {
            document.getElementById('quizBox').classList.add('hidden');
            const reportBox = document.getElementById('reportBox');
            reportBox.classList.remove('hidden');

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalTotalQ').innerText = questionBank.length;
            document.getElementById('finalFirstTry').innerText = firstTryCorrectCount;
            
            const accuracy = Math.round((firstTryCorrectCount / questionBank.length) * 100);
            document.getElementById('finalAccuracy').innerText = accuracy + '%';

            // Custom Title/Badge based on score
            const badgeTitle = document.getElementById('badgeTitle');
            const badgeDesc = document.getElementById('badgeDesc');

            if (accuracy >= 90) {
                badgeTitle.innerText = "🏆 稱號：公因數大師";
                badgeDesc.innerText = "太完美了！你對公因數與最大公因數的概念理解得透徹無比！";
            } else if (accuracy >= 70) {
                badgeTitle.innerText = "🏅 稱號：公因數小達人";
                badgeDesc.innerText = "表現非常出色！繼續保持，你很快就能成為數學學霸！";
            } else if (accuracy >= 50) {
                badgeTitle.innerText = "🌟 稱號：數學探索新星";
                badgeDesc.innerText = "做得好！再多練習幾次，你一定能拿到更高分！";
            } else {
                badgeTitle.innerText = "📖 稱號：勤奮學習小先鋒";
                badgeDesc.innerText = "別灰心！點擊下方「再玩一次」按鈕，再挑戰一次吧！";
            }

            triggerConfetti();
        }

        function restartQuiz() {
            currentQ = 0;
            score = 0;
            firstTryCorrectCount = 0;
            selectedFactors = [];
            
            document.getElementById('reportBox').classList.add('hidden');
            document.getElementById('quizBox').classList.remove('hidden');
            
            updateScoreBoard();
            loadQuestion();
        }

        function showCustomToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white font-bold px-6 py-3 rounded-2xl shadow-xl z-50 text-sm animate-bounce';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
